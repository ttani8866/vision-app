<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JARVIS HUD</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="starfield"></canvas>

  <main id="ring-stage">
    <svg id="ring-svg" viewBox="-200 -200 400 400" aria-hidden="true"></svg>
    <div id="ring-label">
      <div id="ring-label-ja">待機</div>
      <div id="ring-label-en">IDLE</div>
    </div>
    <div id="agent-ring"></div>
  </main>

  <div id="panel-root"></div>

  <footer id="status-bar">
    <span id="status-clock">--:--:--</span>
    <span id="status-sep">/</span>
    <span id="status-state">STATE: IDLE</span>
    <span id="status-sep">/</span>
    <span id="status-dispatch"></span>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
